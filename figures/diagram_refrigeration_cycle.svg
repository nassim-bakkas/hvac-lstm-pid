<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Refrigeration cycle: compressor and condenser outdoors reject heat, expansion valve and evaporator indoors absorb it">
  <title>Refrigeration cycle of a simple HVAC unit</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a3h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- indoor / outdoor boundary -->
    <line x1="450" y1="42" x2="450" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="240" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Outdoor  (35 °C in summer)</text>
    <text x="660" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Indoor  (22 °C setpoint)</text>

    <!-- components -->
    <rect x="150" y="110" width="180" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="240" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Condenser</text>
    <text x="240" y="166" text-anchor="middle" font-size="11.5" fill="#475569">gas → liquid</text>

    <rect x="150" y="310" width="180" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="240" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Compressor</text>
    <text x="240" y="366" text-anchor="middle" font-size="11.5" fill="#475569">raises pressure</text>

    <rect x="570" y="110" width="180" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="660" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Expansion valve</text>
    <text x="660" y="166" text-anchor="middle" font-size="11.5" fill="#475569">drops pressure</text>

    <rect x="570" y="310" width="180" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="660" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Evaporator</text>
    <text x="660" y="366" text-anchor="middle" font-size="11.5" fill="#475569">liquid → gas</text>

    <!-- refrigerant loop -->
    <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a3)">
      <line x1="240" y1="310" x2="240" y2="188"/>
      <line x1="330" y1="146" x2="564" y2="146"/>
      <line x1="660" y1="182" x2="660" y2="304"/>
      <line x1="570" y1="346" x2="336" y2="346"/>
    </g>

    <g font-size="12" fill="#64748b">
      <text x="256" y="252">hot gas</text>
      <text x="256" y="270">high pressure</text>
      <text x="380" y="134" text-anchor="middle">warm liquid</text>
      <text x="676" y="246">cold mix</text>
      <text x="676" y="264">low pressure</text>
      <text x="520" y="370" text-anchor="middle">cool gas</text>
    </g>

    <!-- heat exchange -->
    <line x1="146" y1="146" x2="78" y2="146" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a3h)"/>
    <text x="112" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">heat out</text>

    <line x1="824" y1="346" x2="756" y2="346" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a3h)"/>
    <text x="800" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">heat from room</text>

    <text x="450" y="446" text-anchor="middle" font-size="12.5" fill="#94a3b8">Q = m · cp · |T − T_ref| is evaluated across the evaporator, where the room's heat enters the cycle.</text>
  </g>
</svg>
