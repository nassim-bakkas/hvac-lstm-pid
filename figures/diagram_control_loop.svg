<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 900 262" width="900" height="262" role="img" aria-label="Closed-loop control: setpoint minus measured temperature feeds a PID that drives the servo damper, with the DHT22 closing the loop">
  <title>Closed-loop damper control on the Arduino</title>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="102" width="900" height="256" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- setpoint -->
    <text x="32" y="150" font-size="13" font-weight="bold" fill="#0f172a">setpoint</text>
    <text x="32" y="170" font-size="13" fill="#475569">22 °C</text>
    <line x1="110" y1="160" x2="162" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>

    <!-- summing junction -->
    <circle cx="188" cy="160" r="22" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="188" y="167" text-anchor="middle" font-size="18" fill="#0f172a">Σ</text>
    <text x="167" y="200" font-size="15" font-weight="bold" fill="#dc2626">−</text>
    <text x="168" y="138" font-size="14" fill="#475569">+</text>

    <!-- error -->
    <line x1="210" y1="160" x2="256" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="233" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">e(t)</text>

    <!-- PID -->
    <rect x="258" y="128" width="136" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="326" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">PID</text>
    <text x="326" y="174" text-anchor="middle" font-size="11" fill="#475569">deadband ±0.3 °C</text>

    <!-- u(t) -->
    <line x1="394" y1="160" x2="444" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="419" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">u(t)</text>

    <!-- actuator -->
    <rect x="446" y="128" width="150" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="521" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Servo damper</text>
    <text x="521" y="174" text-anchor="middle" font-size="11" fill="#475569">0–180°, pin D9</text>

    <line x1="596" y1="160" x2="646" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="621" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">airflow</text>

    <!-- plant -->
    <rect x="648" y="128" width="150" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="723" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Room</text>
    <text x="723" y="174" text-anchor="middle" font-size="11" fill="#475569">thermal mass</text>

    <!-- feedback path -->
    <polyline points="798,160 852,160 852,274 724,274" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="866" y="222" text-anchor="middle" font-size="11.5" fill="#64748b">T(t)</text>

    <rect x="574" y="246" width="148" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="648" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">DHT22</text>
    <text x="648" y="289" text-anchor="middle" font-size="11" fill="#475569">1 Hz, pin D2</text>

    <polyline points="574,274 188,274 188,184" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a4)"/>
    <text x="380" y="292" text-anchor="middle" font-size="11.5" fill="#64748b">measured temperature</text>

    <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#94a3b8">In the full hybrid model the LSTM forecast supplies the setpoint schedule; here it is fixed so the loop can be tested alone.</text>
  </g>
</svg>
