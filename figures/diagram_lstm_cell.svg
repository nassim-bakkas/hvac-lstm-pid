<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="LSTM cell: the cell state runs uninterrupted across the top while forget, input, candidate and output gates modify it">
  <title>LSTM cell — the cell state carries information across timesteps</title>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- cell boundary -->
    <rect x="90" y="60" width="740" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="104" y="82" font-size="12" fill="#94a3b8">LSTM cell</text>

    <!-- cell state highway -->
    <line x1="30" y1="120" x2="880" y2="120" stroke="#2563eb" stroke-width="3.5" marker-end="url(#a2b)"/>
    <text x="30" y="106" font-size="13" font-weight="bold" fill="#1d4ed8">C(t−1)</text>
    <text x="878" y="106" text-anchor="end" font-size="13" font-weight="bold" fill="#1d4ed8">C(t)</text>

    <!-- input bus -->
    <line x1="30" y1="345" x2="720" y2="345" stroke="#64748b" stroke-width="2.5"/>
    <text x="30" y="368" font-size="13" fill="#334155">h(t−1), x(t)</text>

    <!-- gate connectors from bus -->
    <g stroke="#64748b" stroke-width="2" marker-end="url(#a2)">
      <line x1="190" y1="345" x2="190" y2="285"/>
      <line x1="340" y1="345" x2="340" y2="285"/>
      <line x1="440" y1="345" x2="440" y2="285"/>
      <line x1="680" y1="345" x2="680" y2="285"/>
    </g>

    <!-- gates -->
    <g>
      <rect x="150" y="225" width="80" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="190" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">σ</text>
      <text x="190" y="270" text-anchor="middle" font-size="11" fill="#475569">forget</text>

      <rect x="300" y="225" width="80" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="340" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">σ</text>
      <text x="340" y="270" text-anchor="middle" font-size="11" fill="#475569">input</text>

      <rect x="400" y="225" width="80" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="440" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">tanh</text>
      <text x="440" y="270" text-anchor="middle" font-size="11" fill="#475569">candidate</text>

      <rect x="640" y="225" width="80" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="680" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">σ</text>
      <text x="680" y="270" text-anchor="middle" font-size="11" fill="#475569">output</text>
    </g>

    <!-- forget multiply on the highway -->
    <line x1="190" y1="225" x2="190" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <circle cx="190" cy="120" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="190" y="126" text-anchor="middle" font-size="16" fill="#0f172a">×</text>

    <!-- input × candidate -->
    <polyline points="340,225 340,180 372,180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <polyline points="440,225 440,180 408,180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <circle cx="390" cy="180" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="390" y="186" text-anchor="middle" font-size="16" fill="#0f172a">×</text>

    <!-- add onto the highway -->
    <line x1="390" y1="164" x2="390" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <circle cx="390" cy="120" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="390" y="127" text-anchor="middle" font-size="17" fill="#0f172a">+</text>

    <!-- branch to output -->
    <polyline points="545,120 545,180 568,180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <circle cx="545" cy="120" r="4" fill="#2563eb"/>
    <rect x="570" y="152" width="76" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="608" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">tanh</text>

    <line x1="646" y1="180" x2="664" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
    <circle cx="680" cy="180" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="680" y="186" text-anchor="middle" font-size="16" fill="#0f172a">×</text>
    <line x1="680" y1="225" x2="680" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

    <!-- h(t) output path -->
    <polyline points="696,180 770,180 770,345 880,345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a2)"/>
    <text x="878" y="368" text-anchor="end" font-size="13" fill="#334155">h(t)</text>

    <text x="460" y="440" text-anchor="middle" font-size="12.5" fill="#64748b">The blue path is never squashed by an activation — that is why gradients survive across ~24 h, and why a plain RNN cannot.</text>
  </g>
</svg>
